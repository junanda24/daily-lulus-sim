<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>LULUS SIM!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root{
        --asphalt:#12151A; --panel:#1B1F26; --panel2:#22272F; --line:#2C333D;
        --ink:#F5F7FA; --muted:#AAB4C0; --faint:#7E8894;
        --yellow:#FFC800; --yellow-ink:#191203;
        --red:#E5484D; --blue:#2563EB; --green:#2FBF71; --green-dark:#0E3B24;
        --radius:14px;
      }
      *{box-sizing:border-box}
      html{-webkit-text-size-adjust:100%}
      body{margin:0;background:var(--asphalt);color:var(--ink);
        font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
        font-size:16px;line-height:1.5;}
      button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
      button:focus-visible,a:focus-visible{outline:3px solid var(--yellow);outline-offset:2px;border-radius:6px}
      .wrap{max-width:680px;margin:0 auto;padding:20px 16px 104px}
      .screen{animation:screenIn .24s ease both}
      @keyframes screenIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
      @media (prefers-reduced-motion:reduce){
        .screen{animation:none}
        .shake{animation:none!important}
        .timer-danger{animation:none!important}
      }
      /* ---------- typography ---------- */
      .display{font-family:"Barlow Condensed",Inter,sans-serif;text-transform:uppercase;letter-spacing:.02em;line-height:.95}
      h1.title{font-family:"Barlow Condensed",Inter,sans-serif;font-size:64px;font-weight:700;
        text-transform:uppercase;line-height:.9;margin:6px 0 4px;letter-spacing:.01em}
      h1.title .accent{color:var(--yellow)}
      .tagline{color:var(--muted);font-size:16px;margin:0 0 4px}
      h2.sec{font-family:"Barlow Condensed",Inter,sans-serif;font-size:30px;font-weight:600;
        text-transform:uppercase;letter-spacing:.03em;margin:26px 0 10px}
      h2.sec:first-child{margin-top:0}
      .page-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
      .page-head h2{font-family:"Barlow Condensed",Inter,sans-serif;font-size:32px;font-weight:600;
        text-transform:uppercase;margin:0;letter-spacing:.03em;line-height:1}
      .page-head .sub{color:var(--muted);font-size:13px;margin-top:2px}
      .back-btn{display:flex;align-items:center;gap:6px;color:var(--ink);font-weight:600;font-size:14px;
        background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;flex:none}
      .back-btn svg{width:18px;height:18px}
      /* ---------- marka divider ---------- */
      .marka{height:0;border-top:4px dashed var(--yellow);opacity:.55;margin:22px 0}
      .marka.white{border-top-color:#E8ECF1}
      /* ---------- stat strip ---------- */
      .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}
      @media(min-width:560px){.stats{grid-template-columns:repeat(4,1fr)}}
      .stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
      .stat .num{font-family:"Barlow Condensed",Inter,sans-serif;font-size:34px;font-weight:700;line-height:1}
      .stat .num.y{color:var(--yellow)}
      .stat .lbl{color:var(--muted);font-size:12.5px;margin-top:3px;line-height:1.35}
      /* ---------- entry cards ---------- */
      .entries{display:grid;gap:12px;margin-top:6px}
      @media(min-width:560px){.entries{grid-template-columns:repeat(3,1fr)}}
      .entry{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);
        border-radius:var(--radius);padding:16px;transition:border-color .15s ease,transform .15s ease}
      .entry:active{transform:scale(.985)}
      .entry .ic{width:46px;height:46px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
      .entry .ic svg{width:26px;height:26px}
      .ic.y{background:var(--yellow);color:var(--yellow-ink)}
      .ic.r{background:var(--red);color:#fff}
      .ic.b{background:var(--blue);color:#fff}
      .entry h3{font-family:"Barlow Condensed",Inter,sans-serif;font-size:24px;font-weight:600;
        text-transform:uppercase;margin:0 0 2px;letter-spacing:.02em}
      .entry p{color:var(--muted);font-size:13.5px;margin:0}
      .entry .go{margin-top:10px;font-weight:700;font-size:13.5px;color:var(--yellow);display:flex;align-items:center;gap:5px}
      .entry .go svg{width:15px;height:15px}
      /* ---------- generic cards / rows ---------- */
      .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
      .empty{color:var(--muted);background:var(--panel);border:1px dashed var(--line);
        border-radius:var(--radius);padding:18px;text-align:center;font-size:14.5px}
      .disclaimer{color:var(--faint);font-size:12.5px;line-height:1.55;margin-top:8px}
      .hist-row{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);
        border-radius:var(--radius);padding:12px 14px;margin-bottom:8px}
      .hist-row .when{flex:1;min-width:0}
      .hist-row .when b{display:block;font-size:15px}
      .hist-row .when span{color:var(--muted);font-size:12.5px}
      .hist-row .score{font-family:"Barlow Condensed",Inter,sans-serif;font-size:28px;font-weight:700;line-height:1}
      .badge{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
        padding:4px 9px;border-radius:999px;white-space:nowrap}
      .badge.pass{background:var(--green);color:#06180E}
      .badge.fail{background:var(--red);color:#fff}
      /* ---------- buttons ---------- */
      .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;
        background:var(--yellow);color:var(--yellow-ink);font-weight:800;font-size:16px;
        border-radius:12px;padding:15px 18px;border:1px solid var(--yellow)}
      .btn:active{transform:scale(.99)}
      .btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
      .btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
      .btn.red{background:var(--red);border-color:var(--red);color:#fff}
      .btn.sm{width:auto;padding:10px 16px;font-size:14px;border-radius:10px}
      .btn[disabled]{opacity:.45;cursor:not-allowed}
      .btn-row{display:grid;gap:10px;margin-top:14px}
      @media(min-width:560px){.btn-row.two{grid-template-columns:1fr 1fr}}
      /* ---------- category rows ---------- */
      .cat-row{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);
        border-radius:var(--radius);padding:15px 16px;margin-bottom:10px}
      .cat-row h3{margin:0;font-size:16.5px;font-weight:700}
      .cat-row .meta{color:var(--muted);font-size:13px;margin-top:2px}
      .bar{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-top:10px}
      .bar i{display:block;height:100%;background:var(--yellow);border-radius:99px}
      .bar i.g{background:var(--green)}
      /* ---------- question card ---------- */
      .qcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
      .qcard.shake{animation:shake .45s ease}
      @keyframes shake{10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(2px)}
        30%,50%,70%{transform:translateX(-5px)}40%,60%{transform:translateX(5px)}}
      .qmeta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
      .qcount{font-weight:700;font-size:13px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
      .qsign{display:flex;justify-content:center;padding:6px 0 14px}
      .qsign svg{width:132px;height:132px}
      .qtext{font-size:18.5px;font-weight:600;line-height:1.45;margin:0 0 16px}
      .opts{display:grid;gap:10px}
      .opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--panel2);
        border:2px solid var(--line);border-radius:12px;padding:13px 14px;font-size:15.5px;line-height:1.4}
      .opt .letter{flex:none;width:28px;height:28px;border-radius:8px;background:var(--asphalt);
        border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
        font-weight:800;font-size:14px;margin-top:-1px}
      .opt.picked{border-color:var(--yellow)}
      .opt.correct{border-color:var(--green);background:var(--green-dark)}
      .opt.correct .letter{background:var(--green);border-color:var(--green);color:#06180E}
      .opt.wrong{border-color:var(--red);background:#3D1417}
      .opt.wrong .letter{background:var(--red);border-color:var(--red);color:#fff}
      .opt.dim{opacity:.55}
      .opt[disabled]{cursor:default}
      .feedback{margin-top:16px;border-radius:12px;padding:14px 16px;font-size:14.5px;line-height:1.55}
      .feedback.ok{background:var(--green-dark);border:1px solid var(--green)}
      .feedback.no{background:#3D1417;border:1px solid var(--red)}
      .feedback b.head{display:block;font-size:15.5px;margin-bottom:4px}
      .feedback .ref{display:inline-block;margin-top:8px;font-size:12px;font-weight:700;letter-spacing:.03em;
        background:rgba(255,255,255,.12);padding:3px 9px;border-radius:999px;text-transform:uppercase}
      .progress-line{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-bottom:16px}
      .progress-line i{display:block;height:100%;background:var(--yellow);transition:width .25s ease}
      /* ---------- exam ---------- */
      .exam-top{position:sticky;top:0;z-index:5;background:var(--asphalt);padding:10px 0 12px;margin:-4px 0 4px}
      .exam-top .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
      .timer{font-family:"Barlow Condensed",Inter,sans-serif;font-size:38px;font-weight:700;line-height:1;
        background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px 16px;min-width:118px;text-align:center}
      .timer-danger{color:#fff!important;background:var(--red)!important;border-color:var(--red)!important;
        animation:tpulse 1s ease-in-out infinite}
      @keyframes tpulse{50%{transform:scale(1.07)}}
      .answered-count{font-weight:700;font-size:14px;color:var(--muted)}
      .answered-count b{color:var(--ink);font-size:17px}
      .grid-wrap{margin:12px 0 4px}
      .numgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
      @media(min-width:560px){.numgrid{grid-template-columns:repeat(10,1fr)}}
      .numgrid button{aspect-ratio:1;border-radius:9px;background:var(--panel2);border:2px solid var(--line);
        font-weight:700;font-size:14.5px;position:relative;color:var(--ink)}
      .numgrid button.done{background:var(--yellow);border-color:var(--yellow);color:var(--yellow-ink)}
      .numgrid button.now{border-color:#fff;box-shadow:0 0 0 2px var(--asphalt),0 0 0 4px #fff}
      .numgrid button.flag::after{content:"";position:absolute;top:4px;right:4px;width:8px;height:8px;
        border-radius:50%;background:var(--red);border:1.5px solid var(--asphalt)}
      .numgrid button.done.flag::after{border-color:var(--yellow)}
      .legend{display:flex;flex-wrap:wrap;gap:14px;color:var(--muted);font-size:12.5px;margin-top:10px}
      .legend span{display:inline-flex;align-items:center;gap:6px}
      .legend i{width:13px;height:13px;border-radius:4px;display:inline-block;border:2px solid var(--line);background:var(--panel2)}
      .legend i.done{background:var(--yellow);border-color:var(--yellow)}
      .legend i.dot{background:var(--red);border-radius:50%;border:none;width:9px;height:9px}
      .exam-actions{display:flex;gap:9px;margin-top:16px}
      .exam-actions .btn{padding:13px 10px;font-size:15px}
      .flag-btn{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:14px;
        border:2px solid var(--line);border-radius:10px;padding:9px 13px;background:var(--panel)}
      .flag-btn svg{width:16px;height:16px}
      .flag-btn.on{border-color:var(--red);color:#FFB3B8;background:#3D1417}
      /* ---------- result ---------- */
      .result-hero{text-align:center;padding:10px 0 2px}
      .result-hero .big{font-family:"Barlow Condensed",Inter,sans-serif;font-size:110px;font-weight:700;line-height:.95}
      .result-hero .big small{font-size:44px;color:var(--muted)}
      .result-hero .verdict{font-family:"Barlow Condensed",Inter,sans-serif;font-size:40px;font-weight:700;
        text-transform:uppercase;letter-spacing:.04em;margin-top:2px}
      .verdict.pass{color:var(--green)} .verdict.fail{color:var(--red)}
      .result-hero .cheer{color:var(--muted);font-size:15.5px;max-width:420px;margin:6px auto 0}
      .tally{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
      .review-item{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
        padding:15px 16px;margin-bottom:10px}
      .review-item .rq{font-weight:600;font-size:15.5px;line-height:1.45;margin:0 0 10px}
      .review-item .rq .n{color:var(--yellow);font-weight:800;margin-right:6px}
      .ans-line{font-size:14px;padding:8px 11px;border-radius:9px;margin-bottom:6px;line-height:1.45}
      .ans-line.good{background:var(--green-dark);border:1px solid var(--green)}
      .ans-line.bad{background:#3D1417;border:1px solid var(--red)}
      .ans-line .tag{font-weight:800;font-size:11px;letter-spacing:.05em;text-transform:uppercase;display:block;opacity:.85}
      .review-item .rexp{color:var(--muted);font-size:13.5px;margin:8px 0 0;line-height:1.55}
      .review-item .rsign{display:flex;justify-content:center;padding:2px 0 10px}
      .review-item .rsign svg{width:88px;height:88px}
      /* ---------- kamus ---------- */
      .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
      .chip{border:2px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 15px;
        font-weight:700;font-size:14px;color:var(--muted)}
      .chip.on{border-color:var(--yellow);background:var(--yellow);color:var(--yellow-ink)}
      .sign-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
      @media(min-width:560px){.sign-grid{grid-template-columns:repeat(4,1fr)}}
      .sign-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
        padding:12px 8px 10px;text-align:center;display:block;width:100%}
      .sign-card svg{width:72px;height:72px}
      .sign-card .nm{font-size:12.5px;font-weight:600;line-height:1.3;margin-top:7px}
      .sign-card .grp{font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
      /* ---------- modal ---------- */
      .overlay{position:fixed;inset:0;background:rgba(4,6,9,.78);z-index:50;display:flex;
        align-items:flex-end;justify-content:center;padding:0}
      @media(min-width:560px){.overlay{align-items:center;padding:20px}}
      .sheet{background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;
        width:100%;max-width:520px;max-height:88vh;overflow:auto;padding:22px 20px 26px;
        animation:sheetIn .24s ease both}
      @media(min-width:560px){.sheet{border-radius:18px}}
      @keyframes sheetIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
      .sheet h3{font-family:"Barlow Condensed",Inter,sans-serif;font-size:28px;font-weight:600;
        text-transform:uppercase;margin:0 0 6px;letter-spacing:.02em}
      .sheet p{color:var(--muted);font-size:14.5px;line-height:1.55;margin:0 0 8px}
      .sheet p b{color:var(--ink)}
      .sheet .sign-big{display:flex;justify-content:center;padding:8px 0 14px}
      .sheet .sign-big svg{width:150px;height:150px}
      .sheet .lbl{font-size:11.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--yellow);margin:14px 0 3px}
      /* ---------- bottom nav ---------- */
      .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#171B21;
        border-top:1px solid var(--line);display:flex;justify-content:center;
        padding-bottom:env(safe-area-inset-bottom)}
      .tabbar .inner{width:100%;max-width:680px;display:grid;grid-template-columns:repeat(5,1fr)}
      .tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px 8px;
        color:var(--faint);font-size:11px;font-weight:600}
      .tab svg{width:22px;height:22px}
      .tab.on{color:var(--yellow)}
      #confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
      .hidden{display:none!important}
    </style>
  </head>
  <body>
    <main class="wrap" id="view"></main>
    <nav class="tabbar" aria-label="Navigasi utama"><div class="inner" id="tabbar"></div></nav>
    <div id="modal-root"></div>
    <canvas id="confetti" class="hidden"></canvas>

    <script>
    "use strict";
    /* ================= DATA: BANK SOAL (60 soal, persis) ================= */
    const QUESTIONS = [
    {"id":1,"cat":"rambu","q":"Rambu berbentuk lingkaran putih dengan tepi merah dan angka 40 di tengahnya berarti...","opts":["Kecepatan minimum 40 km/jam","Kecepatan maksimum yang diperbolehkan 40 km/jam","Jarak ke kota berikutnya 40 km","Jumlah kendaraan maksimal 40 unit"],"a":1,"exp":"Lingkaran putih tepi merah adalah rambu larangan; angka di dalamnya adalah batas kecepatan maksimum.","ref":"Rambu larangan"},
    {"id":2,"cat":"rambu","q":"Rambu berbentuk segitiga dengan warna dasar kuning umumnya berarti...","opts":["Larangan","Perintah","Peringatan akan bahaya atau kondisi jalan di depan","Petunjuk arah"],"a":2,"exp":"Warna kuning pada rambu berarti peringatan, misalnya tikungan tajam atau jalan licin di depan.","ref":"Rambu peringatan"},
    {"id":3,"cat":"rambu","q":"Rambu segitiga terbalik dengan tepi merah dan latar putih berarti...","opts":["Dilarang masuk","Berhenti total","Beri kesempatan kepada kendaraan dari arah lain","Jalan buntu di depan"],"a":2,"exp":"Rambu ini memerintahkan pengemudi memberi kesempatan (yield) pada kendaraan dari arah lain.","ref":"Rambu perintah — beri kesempatan"},
    {"id":4,"cat":"rambu","q":"Rambu lingkaran merah dengan garis horizontal putih di tengahnya berarti...","opts":["Dilarang berhenti","Dilarang masuk","Dilarang parkir","Dilarang mendahului"],"a":1,"exp":"Garis horizontal putih dalam lingkaran merah adalah rambu larangan masuk.","ref":"Rambu larangan"},
    {"id":5,"cat":"rambu","q":"Rambu lingkaran biru dengan panah putih mengarah ke kiri berarti...","opts":["Belok kiri dilarang","Wajib mengikuti arah panah, yaitu belok kiri","Jalan satu arah ke kanan","Putar balik diizinkan"],"a":1,"exp":"Lingkaran biru adalah rambu perintah: pengemudi wajib mengikuti arah yang ditunjukkan panah.","ref":"Rambu perintah"},
    {"id":6,"cat":"rambu","q":"Rambu persegi biru dengan huruf P putih berarti...","opts":["Dilarang parkir","Tempat parkir","Parkir hanya untuk motor","Parkir berbayar"],"a":1,"exp":"Huruf P putih di kotak biru adalah rambu petunjuk tempat parkir.","ref":"Rambu petunjuk"},
    {"id":7,"cat":"rambu","q":"Rambu lingkaran biru tepi merah dengan huruf P dan garis diagonal merah berarti...","opts":["Tempat parkir","Dilarang parkir","Parkir khusus disabilitas","Parkir maksimal 1 jam"],"a":1,"exp":"Garis diagonal merah pada rambu berarti larangan; P yang dicoret berarti dilarang parkir.","ref":"Rambu larangan"},
    {"id":8,"cat":"rambu","q":"Rambu lingkaran biru tepi merah dengan huruf S dan garis diagonal merah berarti...","opts":["Dilarang parkir","Dilarang berhenti","Tempat pemberhentian bus","Batas kecepatan"],"a":1,"exp":"Huruf S (stop) yang dicoret garis merah berarti dilarang berhenti di lokasi itu.","ref":"Rambu larangan"},
    {"id":9,"cat":"rambu","q":"Rambu segitiga kuning dengan gambar orang berjalan kaki berarti...","opts":["Trotoar di depan","Peringatan ada penyeberangan atau banyak pejalan kaki di depan","Jalan khusus pejalan kaki","Dilarang berjalan kaki"],"a":1,"exp":"Segitiga kuning adalah peringatan: waspada, ada pejalan kaki menyeberang di depan.","ref":"Rambu peringatan"},
    {"id":10,"cat":"rambu","q":"Rambu belah ketupat kuning dengan dua garis hitam yang menyempit di tengah berarti...","opts":["Jalan licin di depan","Jalan menyempit di kedua sisi","Jembatan sempit di depan","Tikungan tajam"],"a":1,"exp":"Dua garis yang menyempit menandakan lebar jalan akan berkurang di kedua sisi.","ref":"Rambu peringatan"},

    <script>
    "use strict";
    /* ================= STORE (localStorage: lulus-sim-v1) ================= */
    const LS_KEY = "lulus-sim-v1";
    function defaultStore(){
      const cats = {}; CATEGORIES.forEach(c=>cats[c.id]={a:0,c:0});
      return { totalAnswered:0, totalCorrect:0, cats:cats, exams:[], days:{} };
    }
    const Store = {
      data: null,
      load(){
        try{
          const raw = localStorage.getItem(LS_KEY);
          if(raw){ const d = JSON.parse(raw); if(d && typeof d==="object"){ this.data = Object.assign(defaultStore(), d); return; } }
        }catch(e){ /* abaikan, pakai data kosong */ }
        this.data = defaultStore();
      },
      save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(this.data)); }catch(e){ /* penyimpanan tidak tersedia */ } },
      reset(){ this.data = defaultStore(); try{ localStorage.removeItem(LS_KEY); }catch(e){} },
      recordAnswer(cat, correct){
        const d = this.data;
        d.totalAnswered++; if(correct) d.totalCorrect++;
        if(!d.cats[cat]) d.cats[cat] = {a:0,c:0};
        d.cats[cat].a++; if(correct) d.cats[cat].c++;
        d.days[todayKey()] = true;
        this.save();
      },
      recordExam(entry){
        this.data.exams.unshift(entry);
        this.data.days[todayKey()] = true;
        this.save();
      }
    };
    function todayKey(offsetDays){
      const d = new Date(); if(offsetDays) d.setDate(d.getDate()+offsetDays);
      return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
    }
    function calcStreak(days){
      let streak = 0;
      let start = days[todayKey(0)] ? 0 : (days[todayKey(-1)] ? -1 : null);
      if(start === null) return 0;
      for(let i = start; ; i--){ if(days[todayKey(i)]) streak++; else break; }
      return streak;
    }
    function accuracyOf(a, c){ return a > 0 ? Math.round(c / a * 100) : 0; }

    /* ================= STATE ================= */
    const state = {
      screen: "home",
      practice: null,   /* {cat, queue:[{q, order:[optIdx...], correctPos}], idx, picked, score} */
      exam: null,       /* {items, idx, answers:[], flags:[], remain, timerId, startedAt} */
      result: null,     /* hasil ujian terakhir */
      kamusFilter: "semua",
      gridOpen: true

    /* ================= HELPERS ================= */
    const view = document.getElementById("view");
    const modalRoot = document.getElementById("modal-root");
    function esc(s){ return String(s).replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch])); }
    function shuffle(arr){
      const a = arr.slice();
      for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
      return a;
    }
    function fmtTime(totalSec){
      const s = Math.max(0, Math.floor(totalSec));

    }
    function fmtDate(ts){

    function prepareQuestion(q){

    const ICONS = {

    };
    const TABS = [
      {id:"home",   label:"Beranda",  icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11 L12 4 L20 11"/><path d="M6 9.5 V20 H18 V9.5"/><path d="M10 20 V14.5 H14 V20"/></svg>'},
      {id:"latihan",label:"Latihan",  icon:ICONS.book},

    ];
    function renderTabs(){
      const active = {home:"home", latihan:"latihan", practice:"latihan", "ujian-intro":"ujian",
        exam:"ujian", result:"ujian", kamus:"kamus", statistik:"statistik"}[state.screen] || "home";
      document.getElementById("tabbar").innerHTML = TABS.map(t =>
        '<button class="tab'+(t.id===active?" on":"")+'" data-tab="'+t.id+'" aria-label="'+t.label+'">'+t.icon+'<span>'+t.label+'</span></button>'
      ).join("");
      document.querySelectorAll("[data-tab]").forEach(b => b.addEventListener("click", () => goTab(b.dataset.tab)));
    }
    function goTab(tab){
      if(state.screen === "exam" && tab !== "ujian"){ confirmLeaveExam(() => nav(tab)); return; }
      nav(tab === "ujian" ? "ujian-intro" : tab);
    }
    function nav(screen){
      stopExamTimer();
      state.screen = screen;
      render();
      window.scrollTo(0,0);
    }
    function render(){
      renderTabs();
      const r = { home:renderHome, latihan:renderLatihan, practice:renderPractice,
        "ujian-intro":renderUjianIntro, exam:renderExam, result:renderResult,
        kamus:renderKamus, statistik:renderStatistik }[state.screen];
      view.innerHTML = '<div class="screen">' + (r ? r() : "") + '</div>';
      bindScreen();

    function openModal(html){

      document.getElementById("overlay").addEventListener("click", e => { if(e.target.id === "overlay") closeModal(); });

    /* ================= BERANDA ================= */
    function examSummaryHTML(e){
      return '<div class="hist-row"><div class="when"><b>'+fmtDate(e.ts)+'</b><span>Benar '+e.correct+' dari '+e.total+' soal · '+fmtTime(e.secs)+'</span></div>'

    }
    function renderHome(){

      + '<p class="tagline" style="font-weight:700;color:var(--yellow);letter-spacing:.08em;text-transform:uppercase;font-size:13px">Latihan Ujian Teori SIM A &amp; C</p>'
      + '<h1 class="title">LULUS <span class="accent">SIM!</span></h1>'
      + '<p class="tagline">Gas latihan dikit-dikit tiap hari, biar pas hari ujian kamu tinggal senyum. Semua soal bisa dipelajari per kategori, lengkap dengan penjelasan dan rujukan pasalnya.</p>'
      + '<div class="stats">'
      +   '<div class="stat"><div class="num">'+d.totalAnswered+'</div><div class="lbl">Soal sudah dijawab</div></div>'
      +   '<div class="stat"><div class="num y">'+acc+'%</div><div class="lbl">Akurasi jawabanmu</div></div>'
      +   '<div class="stat"><div class="num">'+passed+'</div><div class="lbl">Ujian simulasi lulus</div></div>'

      + '<div class="marka"></div>'

      +   '<button class="entry" id="go-latihan"><span class="ic y">'+ICONS.book+'</span><h3>Latihan</h3><p>Belajar per kategori, langsung tahu benar atau salah plus penjelasannya.</p><span class="go">Mulai latihan '+ICONS.arrowR+'</span></button>'
      +   '<button class="entry" id="go-ujian"><span class="ic r">'+ICONS.clip+'</span><h3>Ujian Simulasi</h3><p>30 soal acak, waktu 15 menit. Lulus kalau benar minimal 70% (21 soal).</p><span class="go">Mulai ujian '+ICONS.arrowR+'</span></button>'
      +   '<button class="entry" id="go-kamus"><span class="ic b">'+ICONS.warn+'</span><h3>Kamus Rambu</h3><p>34 rambu dalam 4 golongan, lengkap dengan arti dan contoh situasinya.</p><span class="go">Buka kamus '+ICONS.arrowR+'</span></button>'

             : '<div class="empty">Belum ada riwayat ujian. Coba Ujian Simulasi pertamamu — santai saja, ini cuma latihan.</div>')
      + '<div class="marka white"></div>'
      + '<p class="disclaimer">Soal latihan — bukan soal resmi Korlantas Polri. Materi disusun dari UU 22/2009, Perpol 5/2021, dan panduan latihan ujian teori SIM.</p>';

    function bindHome(){
      document.getElementById("go-latihan").addEventListener("click", () => nav("latihan"));
      document.getElementById("go-ujian").addEventListener("click", () => nav("ujian-intro"));
      document.getElementById("go-kamus").addEventListener("click", () => nav("kamus"));
    }

    /* ================= LATIHAN ================= */
    function renderLatihan(){
      const d = Store.data;
      const rows = CATEGORIES.map(c => {
        const s = d.cats[c.id] || {a:0,c:0};
        const acc = accuracyOf(s.a, s.c);
        const total = QUESTIONS.filter(q => q.cat === c.id).length;
        return '<button class="cat-row" data-cat="'+c.id+'"><h3>'+esc(c.name)+'</h3>'
          + '<div class="meta">'+esc(c.desc)+'</div>'
          + '<div class="meta" style="margin-top:8px">'+total+' soal · sudah dijawab '+s.a+' kali · akurasi <b style="color:var(--ink)">'+acc+'%</b></div>'
          + '<div class="bar"><i class="'+(acc>=70?"g":"")+'" style="width:'+acc+'%"></i></div></button>';
      }).join("");
      return '<div class="page-head"><div><h2>Latihan</h2><div class="sub">Pilih satu kategori. Jawaban langsung dibahas, jadi kamu belajar sambil jalan.</div></div></div>' + rows;
    }
    function bindLatihan(){
      document.querySelectorAll("[data-cat]").forEach(b => b.addEventListener("click", () => startPractice(b.dataset.cat)));
    }
    function startPractice(cat){
      const pool = shuffle(QUESTIONS.filter(q => q.cat === cat)).map(prepareQuestion);
      state.practice = { cat:cat, queue:pool, idx:0, picked:-1, score:0, done:false };
      nav("practice");
    }
    function renderPractice(){
      const p = state.practice;
      if(!p) return '<div class="empty">Sesi latihan tidak ditemukan.</div>';
      if(p.done){
        const total = p.queue.length;
        const pct = accuracyOf(total, p.score);
        return '<div class="page-head"><div><h2>Sesi Selesai</h2><div class="sub">'+esc(CAT_NAME[p.cat])+'</div></div></div>'
          + '<div class="card" style="text-align:center;padding:28px 18px">'
          + '<div class="display" style="font-size:64px;font-weight:700;color:var(--yellow)">'+p.score+'<small style="font-size:30px;color:var(--muted)">/'+total+'</small></div>'
          + '<p style="color:var(--muted);margin:6px 0 0">'+(pct>=70 ? "Mantap! Kategori ini sudah di atas ambang lulus. Pertahankan, ya." : "Nggak apa-apa, namanya juga latihan. Ulangi lagi pelan-pelan, penjelasannya yang bikin nempel.")+'</p></div>'
          + '<div class="btn-row two"><button class="btn ghost" id="p-home">Ke Beranda</button><button class="btn" id="p-again">Latihan Lagi</button></div>'
          + '<div class="btn-row"><button class="btn ghost" id="p-cats">Pilih Kategori Lain</button></div>';
      }
      const item = p.queue[p.idx];
      const q = item.q;
      const signKey = Q_SIGN[q.id];
      const letters = ["A","B","C","D"];
      const answered = p.picked >= 0;
      let opts = item.order.map((origIdx, pos) => {
        let cls = "opt";
        if(answered){
          if(pos === item.correctPos) cls += " correct";
          else if(pos === p.picked) cls += " wrong";
          else cls += " dim";
        }
        return '<button class="'+cls+'" data-opt="'+pos+'" '+(answered?"disabled":"")+'><span class="letter">'+letters[pos]+'</span><span>'+esc(q.opts[origIdx])+'</span></button>';
      }).join("");
      let feedback = "";
      if(answered){
        const ok = p.picked === item.correctPos;
        feedback = '<div class="feedback '+(ok?"ok":"no")+'"><b class="head">'+(ok ? "Betul! Kerja bagus." : "Belum tepat — yang benar: "+letters[item.correctPos])+'</b>'
          + esc(q.exp) + '<br/><span class="ref">'+esc(q.ref)+'</span></div>'
          + '<div class="btn-row"><button class="btn" id="p-next">'+(p.idx === p.queue.length - 1 ? "Lihat Hasil Sesi" : "Soal Berikutnya")+'</button></div>';
      }
      return '<div class="page-head"><button class="back-btn" id="p-back">'+ICONS.back+' Kategori</button>'
        + '<div><h2 style="font-size:26px">'+esc(CAT_NAME[p.cat])+'</h2><div class="sub">Mode latihan — tanpa timer, santai saja</div></div></div>'
        + '<div class="progress-line"><i style="width:'+Math.round(p.idx / p.queue.length * 100)+'%"></i></div>'
        + '<div class="qcard" id="qcard"><div class="qmeta"><span class="qcount">Soal '+(p.idx+1)+' dari '+p.queue.length+'</span><span class="qcount">Skor sesi: '+p.score+'</span></div>'
        + (signKey ? '<div class="qsign">'+signSVG(signKey)+'</div>' : '')
        + '<p class="qtext">'+esc(q.q)+'</p><div class="opts">'+opts+'</div>'+feedback+'</div>';
    }
    function bindPractice(){
      const p = state.practice; if(!p) return;
      const back = document.getElementById("p-back");
      if(back) back.addEventListener("click", () => nav("latihan"));
      if(p.done){
        document.getElementById("p-home").addEventListener("click", () => nav("home"));
        document.getElementById("p-again").addEventListener("click", () => startPractice(p.cat));
        document.getElementById("p-cats").addEventListener("click", () => nav("latihan"));
        return;
      }
      document.querySelectorAll("[data-opt]").forEach(b => b.addEventListener("click", () => answerPractice(parseInt(b.dataset.opt, 10))));
      const next = document.getElementById("p-next");
      if(next) next.addEventListener("click", nextPractice);
    }
    function answerPractice(pos){
      const p = state.practice; if(!p || p.picked >= 0) return;
      const item = p.queue[p.idx];
      p.picked = pos;
      const ok = pos === item.correctPos;
      if(ok) p.score++;
      Store.recordAnswer(item.q.cat, ok);
      render();
      if(!ok){
        const card = document.getElementById("qcard");
        if(card) card.classList.add("shake");
      }
      window.scrollTo(0,0);
    }
    function nextPractice(){
      const p = state.practice; if(!p) return;
      if(p.idx >= p.queue.length - 1){ p.done = true; }
      else { p.idx++; p.picked = -1; }
      render(); window.scrollTo(0,0);
    }
    </script>
    <script>
    "use strict";
    /* ================= UJIAN SIMULASI ================= */
    const EXAM_COUNT = 30, EXAM_SECONDS = 15 * 60, PASS_PCT = 70;
    function renderUjianIntro(){
      const d = Store.data;
      const last = d.exams[0];
      return '<div class="page-head"><div><h2>Ujian Simulasi</h2><div class="sub">Rasakan format ujian teori yang sebenarnya.</div></div></div>'
      + '<div class="card">'
      + '<p style="margin:0 0 10px;font-size:15.5px">Sama seperti ujian aslinya:</p>'
      + '<ul style="margin:0;padding-left:20px;color:var(--muted);font-size:15px;line-height:1.75">'
      + '<li><b style="color:var(--ink)">30 soal</b> pilihan ganda, diambil acak dari bank soal</li>'
      + '<li>Waktu <b style="color:var(--ink)">15 menit</b>, dihitung mundur — habis waktu, jawaban otomatis terkumpul</li>'
      + '<li><b style="color:var(--ink)">Lulus</b> bila benar minimal 70%, yaitu 21 dari 30 soal</li>'
      + '<li>Bisa lompat antar soal dan menandai soal yang <b style="color:var(--ink)">ragu-ragu</b></li>'
      + '</ul></div>'
      + (last ? '<h2 class="sec">Ujian Terakhirmu</h2>' + examSummaryHTML(last) : '')
      + '<div class="btn-row"><button class="btn" id="exam-start">Mulai Ujian</button></div>'
      + '<p class="disclaimer" style="text-align:center">Tarik napas dulu. Salah di sini nggak apa-apa — justru di sinilah tempatnya salah.</p>';
    }
    function bindUjianIntro(){
      document.getElementById("exam-start").addEventListener("click", startExam);
    }
    function startExam(){
      const items = shuffle(QUESTIONS).slice(0, EXAM_COUNT).map(prepareQuestion);
      state.exam = { items:items, idx:0, answers:new Array(EXAM_COUNT).fill(-1),
        flags:new Array(EXAM_COUNT).fill(false), remain:EXAM_SECONDS,
        timerId:null, startedAt:Date.now() };
      state.gridOpen = true;
      nav("exam");
      state.exam.timerId = setInterval(tickExam, 1000);
    }
    function stopExamTimer(){
      if(state.exam && state.exam.timerId){ clearInterval(state.exam.timerId); state.exam.timerId = null; }
    }
    function tickExam(){
      const ex = state.exam;
      if(!ex || state.screen !== "exam") return;
      ex.remain--;
      const t = document.getElementById("exam-timer");
      if(t){
        t.textContent = fmtTime(ex.remain);
        t.classList.toggle("timer-danger", ex.remain <= 60 && ex.remain > 0);
      }
      if(ex.remain <= 0) finishExam(true);
    }
    function renderExam(){
      const ex = state.exam;
      if(!ex) return '<div class="empty">Tidak ada ujian yang sedang berjalan.</div>';
      const item = ex.items[ex.idx];
      const q = item.q;
      const signKey = Q_SIGN[q.id];
      const letters = ["A","B","C","D"];
      const answeredCount = ex.answers.filter(a => a >= 0).length;
      const grid = ex.items.map((it, i) => {
        let cls = "";
        if(ex.answers[i] >= 0) cls += " done";
        if(ex.flags[i]) cls += " flag";
        if(i === ex.idx) cls += " now";
        return '<button class="'+cls.trim()+'" data-jump="'+i+'" aria-label="Soal '+(i+1)+'">'+(i+1)+'</button>';
      }).join("");
      const opts = item.order.map((origIdx, pos) =>
        '<button class="opt'+(ex.answers[ex.idx] === pos ? " picked" : "")+'" data-eopt="'+pos+'"><span class="letter">'+letters[pos]+'</span><span>'+esc(q.opts[origIdx])+'</span></button>'
      ).join("");
      return '<div class="exam-top"><div class="row">'
        + '<div class="timer'+(ex.remain <= 60 ? " timer-danger" : "")+'" id="exam-timer" aria-label="Sisa waktu">'+fmtTime(ex.remain)+'</div>'
        + '<div class="answered-count">Terjawab<br/><b>'+answeredCount+'</b> / '+EXAM_COUNT+' soal</div>'
        + '<button class="flag-btn'+(ex.flags[ex.idx] ? " on" : "")+'" id="exam-flag">'+ICONS.flag+' Ragu-ragu</button>'
        + '</div>'
        + '<div class="grid-wrap">'
        + (state.gridOpen
            ? '<div class="numgrid">'+grid+'</div><div class="legend"><span><i class="done"></i> Sudah dijawab</span><span><i class="dot"></i> Ditandai ragu-ragu</span><span><i></i> Belum dijawab</span></div>'
            : '<button class="btn ghost sm" id="grid-show" style="width:100%">Tampilkan daftar nomor soal</button>')
        + '</div></div>'
        + '<div class="qcard"><div class="qmeta"><span class="qcount">Soal '+(ex.idx+1)+' dari '+EXAM_COUNT+'</span><span class="qcount">'+esc(CAT_NAME[q.cat])+'</span></div>'
        + (signKey ? '<div class="qsign">'+signSVG(signKey)+'</div>' : '')
        + '<p class="qtext">'+esc(q.q)+'</p><div class="opts">'+opts+'</div></div>'
        + '<div class="exam-actions">'
        + '<button class="btn ghost" id="exam-prev" '+(ex.idx===0?"disabled":"")+'>Sebelumnya</button>'
        + (ex.idx < EXAM_COUNT - 1
            ? '<button class="btn ghost" id="exam-next">Berikutnya</button>'
            : '<button class="btn" id="exam-submit2">Kumpulkan</button>')
        + '</div>'
        + (ex.idx < EXAM_COUNT - 1 ? '<div class="btn-row"><button class="btn" id="exam-submit">Kumpulkan Jawaban</button></div>' : '');
    }
    function bindExam(){
      const ex = state.exam; if(!ex) return;
      document.querySelectorAll("[data-jump]").forEach(b => b.addEventListener("click", () => { ex.idx = parseInt(b.dataset.jump, 10); render(); }));
      document.querySelectorAll("[data-eopt]").forEach(b => b.addEventListener("click", () => {
        ex.answers[ex.idx] = parseInt(b.dataset.eopt, 10);
        render();
      }));
      document.getElementById("exam-flag").addEventListener("click", () => { ex.flags[ex.idx] = !ex.flags[ex.idx]; render(); });
      const prev = document.getElementById("exam-prev");
      if(prev) prev.addEventListener("click", () => { if(ex.idx > 0){ ex.idx--; render(); } });
      const next = document.getElementById("exam-next");
      if(next) next.addEventListener("click", () => { if(ex.idx < EXAM_COUNT - 1){ ex.idx++; render(); } });
      const gs = document.getElementById("grid-show");
      if(gs) gs.addEventListener("click", () => { state.gridOpen = true; render(); });
      ["exam-submit","exam-submit2"].forEach(id => {
        const el = document.getElementById(id);
        if(el) el.addEventListener("click", confirmSubmitExam);
      });
    }
    function confirmSubmitExam(){
      const ex = state.exam; if(!ex) return;
      const unanswered = ex.answers.filter(a => a < 0).length;
      const flagged = ex.flags.filter(Boolean).length;
      openModal('<h3>Kumpulkan Sekarang?</h3>'
        + (unanswered > 0
            ? '<p>Masih ada <b>'+unanswered+' soal belum dijawab</b>. Soal kosong dihitung salah, lho.</p>'
            : '<p>Semua soal sudah dijawab. Kerja bagus!</p>')
        + (flagged > 0 ? '<p>Dan ada <b>'+flagged+' soal</b> yang kamu tandai ragu-ragu.</p>' : '')
        + '<p>Setelah dikumpulkan, jawaban tidak bisa diubah lagi.</p>'
        + '<div class="btn-row"><button class="btn red" id="m-submit">Ya, Kumpulkan</button>'
        + '<button class="btn ghost" data-close>Cek Lagi</button></div>');
      document.getElementById("m-submit").addEventListener("click", () => { closeModal(); finishExam(false); });
    }
    function confirmLeaveExam(after){
      openModal('<h3>Keluar dari Ujian?</h3>'
        + '<p>Ujian sedang berjalan. Kalau keluar sekarang, seluruh jawaban ujian ini <b>hilang</b> dan tidak tercatat.</p>'
        + '<div class="btn-row"><button class="btn red" id="m-leave">Ya, Keluar</button>'
        + '<button class="btn ghost" data-close>Lanjut Ujian</button></div>');
      document.getElementById("m-leave").addEventListener("click", () => { closeModal(); after(); });
    }
    function finishExam(auto){
      const ex = state.exam; if(!ex) return;
      stopExamTimer();
      let correct = 0;
      const review = ex.items.map((item, i) => {
        const picked = ex.answers[i];
        const ok = picked === item.correctPos;
        if(picked >= 0) Store.recordAnswer(item.q.cat, ok);
        if(ok) correct++;
        return { item:item, picked:picked, ok:ok };
      });
      const score = Math.round(correct / EXAM_COUNT * 100);
      const secs = EXAM_SECONDS - Math.max(0, ex.remain);
      const pass = score >= PASS_PCT;
      const entry = { ts:Date.now(), score:score, correct:correct, total:EXAM_COUNT, pass:pass, secs:secs };
      Store.recordExam(entry);
      state.result = { score:score, correct:correct, wrong:EXAM_COUNT - correct, pass:pass, secs:secs, auto:!!auto, review:review };
      state.exam = null;
      nav("result");
      if(pass) launchConfetti();
    }

    /* ================= HASIL UJIAN ================= */
    function renderResult(){
      const r = state.result;
      if(!r) return '<div class="empty">Belum ada hasil ujian.</div>';
      const letters = ["A","B","C","D"];
      const review = r.review.map((rv, i) => {
        const q = rv.item.q;
        const signKey = Q_SIGN[q.id];
        const userTxt = rv.picked >= 0 ? letters[rv.picked] + ". " + q.opts[rv.item.order[rv.picked]] : "Tidak dijawab";
        const corrTxt = letters[rv.item.correctPos] + ". " + q.opts[rv.item.order[rv.item.correctPos]];
        return '<div class="review-item">'
          + (signKey ? '<div class="rsign">'+signSVG(signKey)+'</div>' : '')
          + '<p class="rq"><span class="n">'+(i+1)+'.</span>'+esc(q.q)+'</p>'
          + '<div class="ans-line '+(rv.ok ? "good" : "bad")+'"><span class="tag">Jawabanmu</span>'+esc(userTxt)+'</div>'
          + (rv.ok ? '' : '<div class="ans-line good"><span class="tag">Jawaban benar</span>'+esc(corrTxt)+'</div>')
          + '<p class="rexp">'+esc(q.exp)+' <b style="color:var(--ink)">'+esc(q.ref)+'</b></p></div>';
      }).join("");
      return '<div class="result-hero">'
        + '<div class="sub" style="color:var(--muted);font-weight:600">'+(r.auto ? "Waktu habis — jawabanmu terkumpul otomatis." : "Hasil Ujian Simulasi")+'</div>'
        + '<div class="big">'+r.score+'<small>%</small></div>'
        + '<div class="verdict '+(r.pass ? "pass" : "fail")+'">'+(r.pass ? "LULUS!" : "BELUM LULUS")+'</div>'
        + '<p class="cheer">'+(r.pass
            ? "Keren! Kamu sudah melewati ambang 70%. Pertahankan ritmenya sampai hari ujian beneran, ya."
            : "Kurang sedikit lagi menuju 70%. Lihat pembahasan di bawah, latih kategori yang masih sering salah, lalu coba lagi.")+'</p></div>'
        + '<div class="tally">'
        + '<div class="stat"><div class="num" style="color:var(--green)">'+r.correct+'</div><div class="lbl">Jawaban benar</div></div>'
        + '<div class="stat"><div class="num" style="color:var(--red)">'+r.wrong+'</div><div class="lbl">Jawaban salah / kosong</div></div>'
        + '<div class="stat"><div class="num">'+fmtTime(r.secs)+'</div><div class="lbl">Waktu pengerjaan</div></div>'
        + '</div>'
        + '<div class="btn-row two"><button class="btn" id="r-again">Ujian Lagi</button><button class="btn ghost" id="r-practice">Latihan Lagi</button></div>'
        + '<h2 class="sec">Pembahasan Soal</h2>' + review
        + '<div class="btn-row"><button class="btn ghost" id="r-home">Ke Beranda</button></div>';
    }
    function bindResult(){
      const again = document.getElementById("r-again");
      if(again) again.addEventListener("click", startExam);
      const pr = document.getElementById("r-practice");
      if(pr) pr.addEventListener("click", () => nav("latihan"));
      const hm = document.getElementById("r-home");
      if(hm) hm.addEventListener("click", () => nav("home"));
    }

    /* ================= CONFETTI (warna marka: kuning, putih, merah) ================= */
    function launchConfetti(){
      if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      const cv = document.getElementById("confetti");
      const ctx = cv.getContext("2d");
      cv.width = window.innerWidth; cv.height = window.innerHeight;
      cv.classList.remove("hidden");
      const colors = ["#FFC800","#FFFFFF","#E5484D"];
      const parts = [];
      for(let i = 0; i < 150; i++){
        parts.push({ x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * 0.35,
          w: 6 + Math.random() * 6, h: 8 + Math.random() * 8,
          vy: 2.2 + Math.random() * 3.2, vx: -1.4 + Math.random() * 2.8,
          rot: Math.random() * Math.PI, vr: -0.12 + Math.random() * 0.24,
          color: colors[i % colors.length] });
      }
      const t0 = performance.now();
      (function frame(now){
        const elapsed = now - t0;
        ctx.clearRect(0, 0, cv.width, cv.height);
        let alive = false;
        parts.forEach(p => {
          p.x += p.vx; p.y += p.vy; p.rot += p.vr;
          if(p.y < cv.height + 24) alive = true;
          ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
          ctx.fillStyle = p.color; ctx.globalAlpha = elapsed > 2400 ? Math.max(0, 1 - (elapsed - 2400) / 700) : 1;
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
        });
        if(alive && elapsed < 3400) requestAnimationFrame(frame);
        else { ctx.clearRect(0, 0, cv.width, cv.height); cv.classList.add("hidden"); }
      })(t0);
    }

    /* ================= KAMUS RAMBU ================= */
    function renderKamus(){
      const f = state.kamusFilter;
      const chips = [{id:"semua", name:"Semua"}].concat(SIGN_GROUPS).map(g =>
        '<button class="chip'+(f === g.id ? " on" : "")+'" data-filter="'+g.id+'">'+g.name+' ('+(g.id==="semua" ? SIGNS.length : SIGNS.filter(s => s.g === g.id).length)+')</button>'
      ).join("");
      const list = SIGNS.filter(s => f === "semua" || s.g === f);
      const cards = list.map(s =>
        '<button class="sign-card" data-sign="'+s.key+'">'+signSVG(s.key)+'<div class="nm">'+esc(s.name)+'</div><div class="grp">'+GROUP_NAME[s.g]+'</div></button>'
      ).join("");
      return '<div class="page-head"><div><h2>Kamus Rambu</h2><div class="sub">Ketuk rambu untuk melihat arti dan contoh situasinya di jalan.</div></div></div>'
        + '<div class="chips">'+chips+'</div><div class="sign-grid">'+cards+'</div>';
    }
    function bindKamus(){
      document.querySelectorAll("[data-filter]").forEach(b => b.addEventListener("click", () => { state.kamusFilter = b.dataset.filter; render(); }));
      document.querySelectorAll("[data-sign]").forEach(b => b.addEventListener("click", () => showSignDetail(b.dataset.sign)));
    }
    function showSignDetail(key){
      const s = SIGN_BY_KEY[key]; if(!s) return;
      openModal('<div class="sign-big">'+signSVG(key)+'</div>'
        + '<h3>'+esc(s.name)+'</h3>'
        + '<p style="margin:0"><span class="badge" style="background:var(--panel2);color:var(--ink);border:1px solid var(--line)">Golongan '+GROUP_NAME[s.g]+'</span></p>'
        + '<div class="lbl">Artinya</div><p>'+esc(s.arti)+'</p>'
        + '<div class="lbl">Contoh Situasi</div><p>'+esc(s.contoh)+'</p>'
        + '<div class="btn-row"><button class="btn ghost" data-close>Tutup</button></div>');
      modalRoot.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeModal));
    }

    /* ================= STATISTIK ================= */
    function renderStatistik(){
      const d = Store.data;
      const acc = accuracyOf(d.totalAnswered, d.totalCorrect);
      const streak = calcStreak(d.days);
      const passed = d.exams.filter(e => e.pass).length;
      const catRows = CATEGORIES.map(c => {
        const s = d.cats[c.id] || {a:0,c:0};
        const a = accuracyOf(s.a, s.c);
        return '<div style="margin-bottom:14px"><div style="display:flex;justify-content:space-between;gap:10px;font-size:14.5px"><b>'+esc(c.name)+'</b><span style="color:var(--muted)">'+s.c+'/'+s.a+' benar · '+a+'%</span></div>'
          + '<div class="bar"><i class="'+(a>=70?"g":"")+'" style="width:'+a+'%"></i></div></div>';
      }).join("");
      const hist = d.exams.length
        ? d.exams.map(examSummaryHTML).join("")
        : '<div class="empty">Belum ada riwayat ujian. Hasil Ujian Simulasi kamu akan tercatat di sini.</div>';
      return '<div class="page-head"><div><h2>Statistik</h2><div class="sub">Semua progresmu tersimpan di perangkat ini.</div></div></div>'
        + '<div class="stats">'
        + '<div class="stat"><div class="num">'+d.totalAnswered+'</div><div class="lbl">Total soal dijawab</div></div>'
        + '<div class="stat"><div class="num y">'+acc+'%</div><div class="lbl">Akurasi keseluruhan</div></div>'
        + '<div class="stat"><div class="num">'+passed+'/'+d.exams.length+'</div><div class="lbl">Ujian lulus dari total ujian</div></div>'
        + '<div class="stat"><div class="num y">'+streak+'</div><div class="lbl">Hari latihan beruntun</div></div>'
        + '</div>'
        + '<h2 class="sec">Akurasi per Kategori</h2><div class="card">'+catRows+'</div>'
        + '<h2 class="sec">Riwayat Ujian</h2>' + hist
        + '<div class="marka"></div>'
        + '<h2 class="sec">Atur Ulang</h2>'
        + '<p style="color:var(--muted);font-size:14.5px;margin:0 0 10px">Hapus semua progres, riwayat ujian, dan streak dari perangkat ini. Tindakan ini tidak bisa dibatalkan.</p>'
        + '<button class="btn red" id="reset-btn">Reset Semua Data</button>';
    }
    function bindStatistik(){
      const rb = document.getElementById("reset-btn");
      if(rb) rb.addEventListener("click", () => {
        openModal('<h3>Reset Semua Data?</h3>'
          + '<p>Seluruh progres latihan, riwayat ujian, akurasi, dan streak akan <b>dihapus permanen</b> dari perangkat ini.</p>'
          + '<div class="btn-row"><button class="btn red" id="m-reset">Ya, Hapus Semua</button>'
          + '<button class="btn ghost" data-close>Batal</button></div>');
        document.getElementById("m-reset").addEventListener("click", () => {
          Store.reset(); closeModal(); nav("statistik");
        });
      });
    }

    /* ================= INIT ================= */
    Store.load();
    render();
    </script>
  </body>
</html>
